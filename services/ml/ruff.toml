target-version = "py312"
line-length = 100

[lint]
# E/W: pycodestyle, F: pyflakes, I: isort (import sorting/grouping),
# UP: pyupgrade (modern syntax for the target Python version).
select = ["E", "F", "I", "UP", "W"]
ignore = [
  # Several user-facing explanation strings run well past any reasonable
  # line length; splitting them isn't a style win, and ruff-format doesn't
  # wrap string literals for you. Rely on line-length only as a soft cap
  # ruff-format enforces for code, not a hard error.
  "E501",
]

[format]
docstring-code-format = true
